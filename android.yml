name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
      - name: Initialize Android Project
        run: |
          bubblewrap init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json --directory=android-app --skip-validation || true
      - name: Build APK & AAB
        run: |
          cd android-app
          bubblewrap build --skipKeyTool
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android-app/app/build/outputs/apk/release/app-release-apk.apk
      - name: Upload AAB artifact (Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android-app/app/build/outputs/bundle/release/app-release.aab
